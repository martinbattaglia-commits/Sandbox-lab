product:
  name: Operación Logística 3PL — Cargas Generales y Regulados ANMAT
  description: >
    Operador logístico 3PL familiar con más de 45 años de trayectoria continua en Buenos Aires (Verotín S.A.).
    Dos sedes propias en CABA (Agustín Magaldi 1765 y Pedro Luján 3159) con racks selectivos y drive-in Mecalux,
    desconsolidación de contenedores, almacenamiento, preparación de pedidos y distribución en un radio de hasta 60 km.
    Dos líneas operativas: Cargas Generales (disponibilidad inmediata) y Productos Farmacéuticos y Médicos Regulados
    bajo normativa ANMAT con ambiente controlado de 20 a 26 °C, procesos bajo estándares ISO 9001 e ISO 14001
    y respaldo de dirección técnica.
  pricing: >
    Cargas Generales desde USD 15 por metro cuadrado.
    Productos Regulados ANMAT con ambiente controlado desde USD 45 por metro cuadrado.
  key_benefits:
    - Ubicación estratégica en CABA (Agustín Magaldi 1765 y Pedro Luján 3159) con acceso rápido a puertos y autopistas en un radio de 60 km.
    - Más de 45 años de trayectoria continua con flexibilidad operativa para absorber picos de stock y desconsolidación de contenedores.
    - Racks selectivos y drive-in Mecalux con trazabilidad digital de inventario.
    - Depósito para productos médicos y farmacéuticos regulados por ANMAT con temperatura controlada de 20 a 26 °C.
  objection_responses:
    ya_tenemos_deposito_propio: >
      Entiendo. Muchos clientes mantienen su base propia y usan nuestros módulos en Barracas como pulmón flexible para
      picos estacionales o desconsolidación de contenedores sin sumar costos fijos.
    ya_trabajamos_con_otro_3pl: >
      Tiene sentido. Si en algún momento necesitan respaldo en CABA o un espacio dedicado con ambiente controlado de 20 a 26 °C
      para líneas médicas o farmacéuticas, podemos cotizar un módulo puntual sin compromiso.
    necesitamos_habilitacion_anmat: >
      Operamos bajo normativa sanitaria con temperatura controlada de 20 a 26 °C, trayectoria comprobada con laboratorios
      y articulación con dirección técnica según el tipo de producto médico o farmacéutico.
  offer:
    entry: Revisión breve de 10 a 15 minutos para validar encaje operativo y disponibilidad de metros cuadrados.
    goal: get_reply
    booking_method: ask_preference
    meeting_duration: 15 minutos
    booking_url: ""
    meeting_owner: Martín F. Battaglia

